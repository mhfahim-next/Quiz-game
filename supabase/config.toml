# Minimal Supabase CLI config for local development (`supabase start`).
# For a hosted project you don't need this file — run the SQL in supabase/migrations instead.
project_id = "quiz-kids"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_confirmations = false

[storage]
file_size_limit = "5MiB"
